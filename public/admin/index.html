<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin ASEATI</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div id="login-view" class="login-view">
      <form id="login-form" class="login-card">
        <img src="/logo-aseati.png" alt="ASEATI" width="180" height="80" />
        <h1>Panel de administración</h1>
        <p>Ingresá la contraseña compartida de la Junta para editar el contenido del sitio.</p>
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input id="password" type="password" autocomplete="current-password" required />
          <button type="button" id="toggle-password" class="password-toggle">
            Mostrar
          </button>
        </div>
        <button type="submit" class="login-submit">Entrar</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>

    <div id="app-view" class="app-view" hidden>
      <div class="admin-top">
        <header class="admin-header">
          <div>
            <strong>ASEATI Admin</strong>
            <span>Edición de contenido</span>
          </div>
          <div class="admin-actions">
            <a href="/" target="_blank" rel="noopener">Ver sitio</a>
            <button type="button" id="save-btn" class="primary">Guardar cambios</button>
            <button type="button" id="logout-btn">Salir</button>
          </div>
        </header>
        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      </div>
      <div class="admin-layout">
        <nav class="admin-nav" aria-label="Secciones">
          <button type="button" data-tab="hero" class="active">Hero</button>
          <button type="button" data-tab="nav">Navegación</button>
          <button type="button" data-tab="medios">Medios</button>
          <button type="button" data-tab="queEs">Qué es ASEATI</button>
          <button type="button" data-tab="carreraAti">Qué es ATI</button>
          <button type="button" data-tab="acreditacion">Acreditación</button>
          <button type="button" data-tab="queHacemos">Qué hacemos</button>
          <button type="button" data-tab="fiestasAti">Fiestas ATI</button>
          <button type="button" data-tab="quienesSomos">Quiénes somos</button>
          <button type="button" data-tab="puestos">Puestos</button>
          <button type="button" data-tab="junta">Junta</button>
          <button type="button" data-tab="tiendati">TIENDATI</button>
          <button type="button" data-tab="remodelacion">Remodelación</button>
          <button type="button" data-tab="reglamento">Reglamento</button>
          <button type="button" data-tab="consultas">Consultas</button>
          <button type="button" data-tab="footer">Contacto / SEO</button>
        </nav>
        <main id="editor" class="editor"></main>
      </div>
    </div>

    <script src="/admin/admin.js" type="module"></script>
  </body>
</html>
